name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "CHANGELOG.md"
      - "llms.txt"
      - "mkdocs.yml"
      - "Makefile"
      - "scripts/docs_hooks.py"
      - "scripts/llms_full.py"
      # doc/deploy.md embeds the reference playbook and its variables.
      - "tests/playbooks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".tool-versions"
      - ".github/site-root/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment; do not cancel in-progress runs so a
# deploy can finish even if a follow-up push lands while it is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read tool versions
        id: tools
        run: awk '{ print $1 "=" $2 }' .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true

      - name: Install docs build dependencies
        run: uv sync --locked --only-group docs

      - name: Build site, llms.txt and llms-full.txt
        env:
          # Repository variable, e.g. G-XXXXXXXXXX. Empty keeps analytics off.
          GOOGLE_ANALYTICS_KEY: ${{ vars.GOOGLE_ANALYTICS_KEY }}
        run: uv run --no-sync make docs SITE_DIR="$PWD/site"

      - name: Copy .github/site-root/ extras into deployed site
        # Anything under .github/site-root/ is copied verbatim to the
        # deployed Pages site root. Use for search-engine verification
        # files (Google, Bing, etc.), /.well-known/ entries,
        # ads.txt, security.txt, etc. — files that must live at the site
        # root but are not part of the mkdocs documentation tree.
        run: |
          if [[ -d .github/site-root ]] && compgen -G ".github/site-root/*" >/dev/null; then
            cp -rv .github/site-root/. site/
          else
            echo ".github/site-root/ empty or missing — nothing to copy"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
