name: Bug report
description: Report a defect in an Ansible role, a Terraform module, a Helm chart, or the test harness.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: please confirm `make check` passes against `main` on a
        clean clone. For a defect in the code or the harness, check that it
        reproduces on the local harness (`doc/quickstart-local.md`); for a
        failure on a real host, attach the output of
        `scripts/collect-diagnostics.sh` (`doc/troubleshooting.md`).
  - type: input
    id: commit
    attributes:
      label: Commit / release
      description: Git SHA, tag, or release this reproduces on.
      placeholder: "e.g. v2.0.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      options:
        - Ansible role
        - Terraform module
        - Helm chart
        - Molecule / Vagrant harness
        - Documentation
        - Makefile / scripts
        - Other
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component name
      description: Role / chart / module / scenario name.
      placeholder: "e.g. lxd, charts/cni-calico, terraform/modules/workload_addons"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal command sequence (make targets, variables, tfvars overrides) to reproduce.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Paste the error message, controller log line, or failing test output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Vagrant + libvirt versions if local, LXD channel, anything that deviates from `doc/deploy.md` or `doc/quickstart-local.md`.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `scripts/collect-diagnostics.sh` (it prints no kubeconfig; check it for anything site-specific before pasting).
      render: shell
    validations:
      required: false
