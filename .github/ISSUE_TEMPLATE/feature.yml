name: Feature / enhancement
description: Propose a new feature, an enhancement, or a roadmap item.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check `ROADMAP.md` first — many likely enhancements are already
        listed there. See `CONTRIBUTING.md` for what is intentionally out of
        scope (site-specific data, privileged containers, raw manifest
        application, rules in the host's firewall) and `doc/decisions/` for why.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete sketch — which role / chart / module would change, and how.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Confirmations
      options:
        - label: I have read `CONTRIBUTING.md` and this is in scope.
          required: true
        - label: I have searched `ROADMAP.md` and the open issues for an existing entry.
          required: true
