apiVersion: v2
name: capi-cluster-class
description: |
  The ClusterClass of one cluster and its five templates for CAPN's unprivileged
  kubeadm path: LXCClusterTemplate, KubeadmControlPlaneTemplate, KubeadmConfigTemplate
  and the control-plane and worker LXCMachineTemplates.
type: application

# Object names do not depend on this version: templates are named after a hash of
# their content (templates/_helpers.tpl).
version: 2.0.0

# The CAPN provider the chart is tested against.
appVersion: "0.9.1"

kubeVersion: ">=1.31.0-0"

keywords:
  - cluster-api
  - capn
  - clusterclass
  - kubeadm

home: https://capn.linuxcontainers.org/

sources:
  - https://github.com/lxc/cluster-api-provider-incus
  - https://cluster-api.sigs.k8s.io/
