{{- define "capi-cluster-class.spec.infra" -}}
{{- $lb := .Values.loadBalancer -}}
template:
  spec:
    {{- /* The Secret names the LXD endpoint and project. The capi-* profiles replace CAPN's kubeadm profile. */}}
    secretRef:
      name: {{ .Values.capn.infrastructureSecretName | quote }}
    unprivileged: true
    skipDefaultKubeadmProfile: true
    cloudProviderNodePatch: false
    {{- /* One HAProxy instance (CAPN's `lxc` mode); capi-base gives it a root disk and the internal NIC. */}}
    loadBalancer:
      lxc:
        instanceSpec:
          profiles:
            - capi-base
            {{- range $lb.profilesExtra }}
            - {{ . | quote }}
            {{- end }}
          {{- with $lb.image }}
          image:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $lb.flavor }}
          flavor: {{ . | quote }}
          {{- end }}
          {{- with $lb.target }}
          target: {{ . | quote }}
          {{- end }}
        {{- /* CAPN's own template binds IPv4 only, but the endpoint may be IPv6. */}}
        customHAProxyConfigTemplate: |
          {{- .Files.Get "files/haproxy.cfg.tmpl" | trimSuffix "\n" | nindent 10 }}
        {{- if $lb.disableHealthzCheck }}
        disableHealthzCheck: true
        {{- end }}
{{- end -}}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: LXCClusterTemplate
metadata:
  {{- include "capi-cluster-class.metadata" (list . "infra") | nindent 2 }}
spec:
  {{- include "capi-cluster-class.spec.infra" . | nindent 2 }}
