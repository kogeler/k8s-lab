{{- define "capi-cluster-class.spec.md-0-boot" -}}
{{- $w := .Values.worker -}}
template:
  spec:
    format: cloud-config
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          {{- include "capi-cluster-class.kubeletArgs" $w.kubeletExtraArgs | nindent 10 }}
    files:
      {{- include "capi-cluster-class.nodeFiles" . | nindent 6 }}
    preKubeadmCommands:
      {{- include "capi-cluster-class.nodeCommands" $w.preKubeadmCommands | nindent 6 }}
    {{- with $w.postKubeadmCommands }}
    postKubeadmCommands:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end -}}
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  {{- include "capi-cluster-class.metadata" (list . "md-0-boot") | nindent 2 }}
spec:
  {{- include "capi-cluster-class.spec.md-0-boot" . | nindent 2 }}
