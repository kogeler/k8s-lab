{{- /*
One ClusterClass per cluster, named after it. A changed template is a new
object (templates/_helpers.tpl); this object is updated to point at it, and
Cluster API rolls the machines that use it.
*/}}
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: cluster-api
spec:
  # The Cluster's service and pod CIDRs reach the control-plane components.
  patches:
    - name: kubeadm-dual-stack-component-args
      description: "Propagate Cluster.spec.clusterNetwork CIDRs into kubeadm-managed control-plane component args."
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: service-cluster-ip-range
                  value: "{{ "{{" }} .builtin.cluster.network.services | join "," {{ "}}" }}"
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/controllerManager/extraArgs/-
              valueFrom:
                template: |
                  name: cluster-cidr
                  value: "{{ "{{" }} .builtin.cluster.network.pods | join "," {{ "}}" }}"
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/controllerManager/extraArgs/-
              valueFrom:
                template: |
                  name: service-cluster-ip-range
                  value: "{{ "{{" }} .builtin.cluster.network.services | join "," {{ "}}" }}"
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: LXCClusterTemplate
      name: {{ include "capi-cluster-class.templateName" (list . "infra") }}
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: {{ include "capi-cluster-class.templateName" (list . "kcp") }}
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: LXCMachineTemplate
        name: {{ include "capi-cluster-class.templateName" (list . "cp") }}
  # One worker class; the Cluster's topology refers to it as md-0.
  workers:
    machineDeployments:
      - class: md-0
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: LXCMachineTemplate
            name: {{ include "capi-cluster-class.templateName" (list . "md-0") }}
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: {{ include "capi-cluster-class.templateName" (list . "md-0-boot") }}
