{{- define "capi-cluster-class.spec.md-0" -}}
{{- $w := .Values.worker -}}
template:
  spec:
    instanceType: container
    {{- with $w.flavor }}
    flavor: {{ . | quote }}
    {{- end }}
    image:
      {{- include "capi-cluster-class.image" $w.image | nindent 6 }}
    profiles:
      - capi-base
      - capi-worker
      {{- range $w.profilesExtra }}
      - {{ . | quote }}
      {{- end }}
    {{- with $w.devicesExtra }}
    devices:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end -}}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: LXCMachineTemplate
metadata:
  {{- include "capi-cluster-class.metadata" (list . "md-0") | nindent 2 }}
spec:
  {{- include "capi-cluster-class.spec.md-0" . | nindent 2 }}
