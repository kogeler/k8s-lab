{{- define "capi-cluster-class.spec.cp" -}}
{{- $cp := .Values.controlPlane -}}
template:
  spec:
    {{- /* Unprivileged system containers only; the capi-* profiles come from the lxd role. */}}
    instanceType: container
    {{- with $cp.flavor }}
    flavor: {{ . | quote }}
    {{- end }}
    image:
      {{- include "capi-cluster-class.image" $cp.image | nindent 6 }}
    profiles:
      - capi-base
      - capi-controlplane
      {{- range $cp.profilesExtra }}
      - {{ . | quote }}
      {{- end }}
    {{- with $cp.devicesExtra }}
    devices:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end -}}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: LXCMachineTemplate
metadata:
  {{- include "capi-cluster-class.metadata" (list . "cp") | nindent 2 }}
spec:
  {{- include "capi-cluster-class.spec.cp" . | nindent 2 }}
