{{- define "capi-cluster-class.spec.kcp" -}}
{{- $cp := .Values.controlPlane -}}
template:
  spec:
    rollout:
      before:
        certificatesExpiryDays: {{ $cp.certificatesExpiryDays }}
    kubeadmConfigSpec:
      format: cloud-config
      clusterConfiguration:
        certificateValidityPeriodDays: {{ $cp.certificateValidityPeriodDays }}
        {{- with $cp.featureGates }}
        featureGates:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- /* The API server listens on both families. The ClusterClass patches add the service and pod CIDRs. */}}
        apiServer:
          extraArgs:
            - name: bind-address
              value: "::"
            {{- with $cp.apiServerExtraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        controllerManager:
          extraArgs:
            - name: allocate-node-cidrs
              value: "true"
            {{- with $cp.controllerManagerExtraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with $cp.schedulerExtraArgs }}
        scheduler:
          extraArgs:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      initConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            {{- include "capi-cluster-class.kubeletArgs" $cp.kubeletExtraArgs | nindent 12 }}
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            {{- include "capi-cluster-class.kubeletArgs" $cp.kubeletExtraArgs | nindent 12 }}
      files:
        {{- include "capi-cluster-class.nodeFiles" . | nindent 8 }}
        {{- /*
        kube-proxy in nftables mode (Calico's nftables dataplane needs it),
        without conntrack sizing (the host-global sysctls are read-only in an
        unprivileged container), and with NodePorts on the external network only
        (unset, nftables mode takes the node's primary addresses: eth0). Only
        `kubeadm init` reads it; joining nodes take the kube-proxy ConfigMap that
        init wrote.
        */}}
        - path: /run/k8s-lab/kube-proxy.yaml
          owner: root:root
          permissions: "0644"
          content: |
            ---
            apiVersion: kubeproxy.config.k8s.io/v1alpha1
            kind: KubeProxyConfiguration
            mode: nftables
            nodePortAddresses:
              - {{ .Values.externalNetwork.ipv6Prefix | quote }}
            conntrack:
              maxPerCore: 0
              min: 0
      preKubeadmCommands:
        - "if [ -f /run/kubeadm/kubeadm.yaml ] && [ ! -f /run/kubeadm/kubeadm-join-config.yaml ]; then cat /run/k8s-lab/kube-proxy.yaml >> /run/kubeadm/kubeadm.yaml; fi"
        {{- include "capi-cluster-class.nodeCommands" $cp.preKubeadmCommands | nindent 8 }}
      {{- with $cp.postKubeadmCommands }}
      postKubeadmCommands:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
{{- if ge (int .Values.controlPlane.certificatesExpiryDays) (int .Values.controlPlane.certificateValidityPeriodDays) }}
{{- fail "controlPlane.certificatesExpiryDays must be smaller than controlPlane.certificateValidityPeriodDays" }}
{{- end }}
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  {{- include "capi-cluster-class.metadata" (list . "kcp") | nindent 2 }}
spec:
  {{- include "capi-cluster-class.spec.kcp" . | nindent 2 }}
