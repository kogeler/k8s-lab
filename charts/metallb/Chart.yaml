apiVersion: v2
name: metallb
description: |
  Upstream MetalLB in native L2 mode (no FRR, no frr-k8s). The address pool, the
  L2 advertisement and Gate A are in charts/metallb-config, installed after this
  release: the upstream chart ships its CRDs as templates, so a pool in the same
  release would not validate at install time.
type: application

version: 2.0.0

# The MetalLB release pinned through the dependency.
appVersion: v0.16.2

dependencies:
  - name: metallb
    version: 0.16.2
    repository: https://metallb.github.io/metallb

sources:
  - https://github.com/metallb/metallb
  - https://metallb.io/installation/
