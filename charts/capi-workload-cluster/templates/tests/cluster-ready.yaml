{{- /*
`helm test`: the Cluster has converged on what its last change asked for. The
init containers run one after the other, one `kubectl wait` each; a wait counts
a condition only once it was computed for the object's current generation, so a
status from before the change never passes:
  - the topology controller has applied the Cluster's topology (an upgrade stays
    pending until the control plane and every MachineDeployment carry the new
    version);
  - the control plane and the MachineDeployments have finished rolling out and
    scaling;
  - every machine of both is Ready (its node Ready; on the control plane also
    its etcd member and control-plane Pods) — scaling is done once the last
    machine exists, while its node may still be joining;
  - the Cluster is Available (Cluster API's summary of the infrastructure, the
    control plane, the workers, the remote connection and the topology).
Run it once the CNI is up: workers are not available before.

A Job, not a bare Pod: the check can run on the cluster it waits for (mgmt-1
manages itself), whose rollout drains every node in turn. A Pod removed by a
disruption (eviction, node deletion) is replaced and the waits start again; any
other failure fails the check at once. `helm test --logs` prints only bare
Pods: `kubectl logs job/<cluster>-test-cluster-ready --all-containers` shows
these.
*/}}
{{- $byName := printf "--field-selector=metadata.name=%s" .Values.cluster.name }}
{{- $byCluster := printf "--selector=cluster.x-k8s.io/cluster-name=%s" .Values.cluster.name }}
{{- $kcp := "kubeadmcontrolplanes.controlplane.cluster.x-k8s.io" }}
{{- $md := "machinedeployments.cluster.x-k8s.io" }}
{{- $waits := list
      (list "topology" "clusters.cluster.x-k8s.io" $byName "TopologyReconciled=True")
      (list "control-plane-rollout" $kcp $byCluster "RollingOut=False")
      (list "control-plane-scale-up" $kcp $byCluster "ScalingUp=False")
      (list "control-plane-scale-down" $kcp $byCluster "ScalingDown=False")
      (list "workers-rollout" $md $byCluster "RollingOut=False")
      (list "workers-scale-up" $md $byCluster "ScalingUp=False")
      (list "workers-scale-down" $md $byCluster "ScalingDown=False")
      (list "control-plane-machines-ready" $kcp $byCluster "MachinesReady=True")
      (list "workers-machines-ready" $md $byCluster "MachinesReady=True")
      (list "available" "clusters.cluster.x-k8s.io" $byName "Available=True") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.cluster.name }}-test-cluster-ready
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capi-workload-cluster.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  template:
    metadata:
      labels:
        {{- include "capi-workload-cluster.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.cluster.name }}-test
      restartPolicy: Never
      initContainers:
        {{- range initial $waits }}
        {{- include "capi-workload-cluster.testWait" (dict "root" $ "wait" .) | nindent 8 }}
        {{- end }}
      containers:
        {{- include "capi-workload-cluster.testWait" (dict "root" $ "wait" (last $waits)) | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
