apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: {{ .Values.cluster.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capi-workload-cluster.labels" . | nindent 4 }}
  annotations:
    # The host port of the published API server; Ansible and Terraform read it
    # to write the runner-side kubeconfig.
    k8s-lab.io/api-proxy-port: {{ include "capi-workload-cluster.apiProxyPort" . | quote }}
    {{- with .Values.cluster.classRevision }}
    # The revision of the ClusterClass release this Cluster was last applied
    # with: a template change changes no field of the Cluster, and this tells
    # Terraform's add-on root to check the rollout again.
    k8s-lab.io/class-revision: {{ . | quote }}
    {{- end }}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        {{- toYaml .Values.clusterNetwork.pods.cidrBlocks | nindent 8 }}
    services:
      cidrBlocks:
        {{- toYaml .Values.clusterNetwork.services.cidrBlocks | nindent 8 }}
  topology:
    # The ClusterClass of this cluster (charts/capi-cluster-class).
    classRef:
      name: {{ .Values.cluster.name | quote }}
    version: {{ .Values.kubernetes.version | quote }}
    controlPlane:
      replicas: {{ .Values.topology.controlPlane.replicas }}
    workers:
      machineDeployments:
        - class: md-0
          name: md-0
          replicas: {{ .Values.topology.workers.replicas }}
