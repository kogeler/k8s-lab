# Announce on the external interface only (eth1: the network contract marks
# the replies to what arrives there), and only from workers: the interfaces
# selector alone does not decide which node leads an address.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Release.Name }}-v6
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metallb-config.labels" . | nindent 4 }}
spec:
  ipAddressPools:
    - {{ .Release.Name }}-v6
  interfaces:
    - eth1
  nodeSelectors:
    - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
      {{- with .Values.l2.extraNodeSelectors }}
      matchLabels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
