apiVersion: v2
name: metallb-config
description: |
  The IPv6 address pool and its L2 advertisement (workers only, one interface),
  and Gate A as `helm test` (a LoadBalancer Service gets a pool address and
  answers). Installed after charts/metallb, which registers the CRDs.
type: application

version: 2.0.0

# The MetalLB API the objects target (metallb.io/v1beta1).
appVersion: v0.16.2

sources:
  - https://github.com/metallb/metallb
  - https://metallb.io/configuration/
