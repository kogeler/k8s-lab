apiVersion: v2
name: cni-calico
description: |
  The Calico tigera-operator. It creates the Calico and operator.tigera.io CRDs
  itself (`manageCRDs`, the upstream default); the Installation, the APIServer
  and Gate B are in charts/cni-calico-config, installed after this release.
type: application

version: 2.0.0

# The Calico release pinned through the tigera-operator dependency.
appVersion: v3.33.1

dependencies:
  - name: tigera-operator
    version: v3.33.1
    repository: https://docs.tigera.io/calico/charts

sources:
  - https://github.com/projectcalico/calico
  - https://docs.tigera.io/calico/latest/getting-started/kubernetes/helm
