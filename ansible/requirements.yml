---
# Direct collection dependencies, lower bounds only. The exact versions that are
# installed, transitive ones included, are in requirements.lock.yml (`make deps`);
# `make deps-upgrade` re-resolves that file from this one.
collections:
  - name: ansible.posix
    version: ">=2.2.2"
  - name: community.general
    version: ">=14.0.1"
  - name: community.crypto
    version: ">=3.5.1"
  # kubernetes.core needs the `kubernetes` Python package wherever its modules run.
  - name: kubernetes.core
    version: ">=6.6.0"
