---
# mgmt.kubeconfig always means the management cluster. It is rebuilt from the
# Cluster API kubeconfig Secret on every run, so a renewed client certificate
# reaches the host and the runner.
- name: "management-cluster | kubeconfig | read the kubeconfig Secret"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ management_cluster_kubeconfig }}"
    api_version: v1
    kind: Secret
    namespace: "{{ management_cluster_namespace }}"
    name: "{{ management_cluster_name }}-kubeconfig"
  register: _management_cluster_kubeconfig_secret
  failed_when: _management_cluster_kubeconfig_secret.resources | length != 1
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  no_log: true

- name: "management-cluster | kubeconfig | read the published API port"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ management_cluster_kubeconfig }}"
    api_version: cluster.x-k8s.io/v1beta2
    kind: Cluster
    namespace: "{{ management_cluster_namespace }}"
    name: "{{ management_cluster_name }}"
  register: _management_cluster_kubeconfig_cluster
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: "management-cluster | kubeconfig | the published API port"
  ansible.builtin.set_fact:
    _management_cluster_kubeconfig_port: >-
      {{ _management_cluster_kubeconfig_cluster.resources[0].metadata.annotations['k8s-lab.io/api-proxy-port'] }}

# One content on host and runner, composed in task variables: the
# credentials never become a fact.
- name: "management-cluster | kubeconfig | host and runner copies"
  vars:
    _source: "{{ _management_cluster_kubeconfig_secret.resources[0].data.value | b64decode | from_yaml }}"
    _kubeconfig:
      apiVersion: "v1"
      kind: "Config"
      clusters:
        - name: "{{ _source.clusters[0].name }}"
          cluster: "{{ _source.clusters[0].cluster | combine({
              'server': 'https://' ~ management_cluster_api_host ~ ':' ~ _management_cluster_kubeconfig_port,
              'tls-server-name': _management_cluster_tls_server_name}) }}"
      users: "{{ _source.users }}"
      contexts: "{{ _source.contexts }}"
      current-context: "{{ _source['current-context'] }}"
    _content: "{{ _kubeconfig | to_nice_yaml(indent=2) }}"
  block:
    - name: "management-cluster | kubeconfig | write on the host"
      ansible.builtin.copy:
        dest: "{{ _management_cluster_kubeconfig_host }}"
        content: "{{ _content }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: "management-cluster | kubeconfig | write on the runner"
      ansible.builtin.copy:
        dest: "{{ _management_cluster_kubeconfig_runner }}"
        content: "{{ _content }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      diff: false

# The only check of the published port from the runner's side.
- name: "management-cluster | kubeconfig | API answers on the published port"
  ansible.builtin.uri:
    url: "https://{{ management_cluster_api_host }}:{{ _management_cluster_kubeconfig_port }}/livez"
    method: GET
    validate_certs: false
    status_code: [200, 401]
    timeout: 10
  register: _management_cluster_kubeconfig_livez
  retries: 60
  delay: 10
  until: _management_cluster_kubeconfig_livez.status in [200, 401]
  delegate_to: localhost
  become: false
