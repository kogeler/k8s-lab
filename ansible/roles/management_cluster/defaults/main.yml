---
# Runner-side kubeconfig of the API that currently holds the Cluster object
# (published by this role's `state` entry point).
management_cluster_kubeconfig: "{{ k8s_lab_management_kubeconfig_runner }}"
# Host directory with bin/ (kubectl) and etc/ (the kubeconfigs), and the
# runner directory of the kubeconfigs.
management_cluster_opt_root: "{{ k8s_lab_opt_root }}"
management_cluster_artifacts_dir: "{{ k8s_lab_artifacts_dir }}"
# Address the runner reaches the published API servers on, and the host address
# mgmt-1's API listens on.
management_cluster_api_host: "{{ k8s_lab_lxd_host_address }}"
management_cluster_api_listen_address: "{{ k8s_lab_api_listen_address }}"
# The handoff file Terraform roots read.
management_cluster_handoff_path: "{{ management_cluster_artifacts_dir }}/handoff.json"

management_cluster_name: "{{ k8s_lab_management_cluster_name }}"
management_cluster_namespace: "{{ k8s_lab_cluster_namespace }}"
management_cluster_kubernetes_version: "{{ k8s_lab_kubernetes_version }}"
management_cluster_infrastructure_secret_name: "{{ k8s_lab_infrastructure_secret_name }}"
management_cluster_lxd_project: "{{ k8s_lab_project_name }}"
management_cluster_bootstrap_instance: "{{ k8s_lab_bootstrap_instance_name }}"

# Odd control-plane count (stacked etcd); Gate B needs two workers.
management_cluster_controlplane_count: 1
management_cluster_worker_count: 2

# Dual-stack networks as [IPv4, IPv6]; Calico's IP pools follow the pod CIDRs.
management_cluster_pod_cidrs: ["10.244.0.0/16", "fd42:77:2::/56"]
management_cluster_service_cidrs: ["10.96.0.0/16", "fd42:77:3::/112"]

# The external IPv6 network the nodes' eth1 is on (required, no default):
# NodePorts answer there only; Terraform roots get it through the handoff.
# management_cluster_external_ipv6_prefix:

# MetalLB: IPv6 VIP range on the external network, `<first>-<last>` (required,
# no default); the workers announce it on eth1.
# management_cluster_metallb_vip_range_v6:

# Helm timeouts (Go durations). The Cluster release waits for its hook, which
# publishes the API server; longer than the hook's own deadlines (45 min).
management_cluster_class_timeout: "5m"
management_cluster_cluster_timeout: "50m"
management_cluster_addons_timeout: "10m"
management_cluster_cluster_test_timeout: "35m"
management_cluster_gates_timeout: "15m"

management_cluster_enabled: true
management_cluster_flow_control_cluster: true
management_cluster_flow_control_kubeconfig: true
management_cluster_flow_control_addons: true
management_cluster_flow_control_gates: true
management_cluster_flow_control_handoff: true
