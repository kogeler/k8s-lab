---
- name: "lxd | snap | snapd socket"
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: true

- name: "lxd | snap | wait for snapd seeding"
  ansible.builtin.systemd:
    name: snapd.seeded.service
  register: _lxd_snap_seeded
  until: _lxd_snap_seeded.status.SubState | default('') == 'exited'
  retries: 36
  delay: 5
  changed_when: false

# The lxd snap needs a newer snapd than Debian ships: the snapd snap makes the
# daemon re-execute into it. A fresh snapd can answer "not found" to its first
# store lookups.
- name: "lxd | snap | snapd and lxd"
  community.general.snap:
    name: "{{ item.name }}"
    channel: "{{ item.channel }}"
  loop:
    - {name: snapd, channel: latest/stable}
    - {name: lxd, channel: "{{ lxd_snap_channel }}"}
  register: _lxd_snap_install
  retries: 6
  delay: 10
  until: _lxd_snap_install is succeeded

- name: "lxd | snap | refresh hold of lxd"
  ansible.builtin.command:
    argv: [snap, list, lxd]
  register: _lxd_snap_list
  changed_when: false

# An automatic refresh restarts the daemon at a time nobody chose; changing
# lxd_snap_channel is the upgrade. Only the lxd snap is held.
- name: "lxd | snap | hold automatic refreshes of lxd"
  ansible.builtin.command:
    argv: [snap, refresh, --hold, lxd]
  when: "'held' not in ((_lxd_snap_list.stdout_lines | last).split() | last).split(',')"
  changed_when: true

- name: "lxd | snap | daemon answers"
  ansible.builtin.command:
    argv: [/snap/bin/lxd, waitready, --timeout=300]
  changed_when: false
