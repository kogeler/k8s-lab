---
- name: "lxd | network | read the network"
  ansible.builtin.uri:
    url: "http://localhost/1.0/networks/{{ _lxd_network.name }}"
    unix_socket: "{{ _lxd_socket }}"
    status_code: [200, 404]
  register: _lxd_network_live

# Every node's address, gateway and lease live on this subnet.
- name: "lxd | network | no new addresses under running instances"
  ansible.builtin.assert:
    that: >-
      _lxd_network_live.status == 404 or _instances | length == 0
      or (_config['ipv4.address'] | default('') == lxd_network_ipv4_address
          and _config['ipv6.address'] | default('') == lxd_network_ipv6_address)
    fail_msg: >-
      {{ _lxd_network.name }} has {{ _config['ipv4.address'] | default('') }} and
      {{ _config['ipv6.address'] | default('') }} and instances attached ({{ _instances | length }}):
      re-addressing it would strand them. Keep lxd_network_ipv4_address and
      lxd_network_ipv6_address, or move the instances off the network first.
  vars:
    _config: "{{ _lxd_network_live.json.metadata.config | default({}) }}"
    _instances: "{{ _lxd_network_live.json.metadata.used_by | default([], true) | select('search', '/instances/') | list }}"

- name: "lxd | network | the internal node network"
  ansible.builtin.include_tasks: ensure.yml
  vars:
    _lxd_ensure:
      label: network
      path: /1.0/networks
      name: "{{ _lxd_network.name }}"
      create: "{{ _lxd_network }}"
      body: {description: "{{ _lxd_network.description }}", config: "{{ _lxd_network.config }}"}
      method: PATCH
