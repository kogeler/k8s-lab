---
capn_identity_kubeconfig: "{{ k8s_lab_management_kubeconfig_runner }}"  # runner path of the API that manages mgmt-1 now
capn_identity_project: "{{ k8s_lab_project_name }}"                     # the only LXD project the identity may use
capn_identity_secret_name: "{{ k8s_lab_infrastructure_secret_name }}"
capn_identity_namespaces: ["{{ k8s_lab_cluster_namespace }}"]           # one Secret per namespace of LXCClusters
capn_identity_dir: "{{ k8s_lab_opt_root }}/etc/capn_identity"           # the only copy of the key
capn_identity_validity_days: 1825
capn_identity_rotate: false                                             # new key and certificate in this run
capn_identity_enabled: true
capn_identity_flow_control_certificate: true
capn_identity_flow_control_trust: true
capn_identity_flow_control_secret: true
