---
# The endpoint and server certificate are what LXD reports now (the lxd role
# binds the listener).
- name: "capn-identity | secret | read the LXD listener and server certificate"
  ansible.builtin.uri:
    url: http://localhost/1.0
    unix_socket: "{{ _capn_identity_socket }}"
  register: _capn_identity_secret_daemon

- name: "capn-identity | secret | LXD listens for CAPN"
  ansible.builtin.assert:
    that: _capn_identity_secret_daemon.json.metadata.config['core.https_address'] | default('') | length > 0
    fail_msg: LXD has no HTTPS listener (core.https_address); run the lxd role first.
    quiet: true

- name: "capn-identity | secret | read the key and certificate"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: ["{{ _capn_identity_key }}", "{{ _capn_identity_crt }}"]
  register: _capn_identity_secret_files
  no_log: true

- name: "capn-identity | secret | on the managing API"
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _address: "{{ _capn_identity_secret_daemon.json.metadata.config['core.https_address'] }}"
  block:
    - name: "capn-identity | secret | namespaces"
      kubernetes.core.k8s:
        kubeconfig: "{{ capn_identity_kubeconfig }}"
        definition: {apiVersion: v1, kind: Namespace, metadata: {name: "{{ item }}"}}
      loop: "{{ capn_identity_namespaces }}"

    # Server-side apply: no last-applied annotation carries the key. The move
    # label takes the Secret along with clusterctl move.
    - name: "capn-identity | secret | identity Secrets"
      kubernetes.core.k8s:
        kubeconfig: "{{ capn_identity_kubeconfig }}"
        apply: true
        server_side_apply: {field_manager: k8s-lab, force_conflicts: true}
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: "{{ capn_identity_secret_name }}"
            namespace: "{{ item }}"
            labels: {clusterctl.cluster.x-k8s.io/move: "true"}
          stringData:
            server: "https://{{ _address }}"
            project: "{{ capn_identity_project }}"
            server-crt: "{{ _capn_identity_secret_daemon.json.metadata.environment.certificate }}"
            client-key: "{{ _capn_identity_secret_files.results[0].content | b64decode }}"
            client-crt: "{{ _capn_identity_secret_files.results[1].content | b64decode }}"
      loop: "{{ capn_identity_namespaces }}"
      no_log: true

# The identity in the Secrets must work before older ones are dropped.
- name: "capn-identity | secret | LXD accepts the certificate"
  ansible.builtin.uri:
    url: "https://{{ _capn_identity_secret_daemon.json.metadata.config['core.https_address'] }}/1.0?project={{ capn_identity_project }}"
    client_cert: "{{ _capn_identity_crt }}"
    client_key: "{{ _capn_identity_key }}"
    validate_certs: false
  register: _capn_identity_secret_probe
  failed_when: _capn_identity_secret_probe.json.metadata.auth | default('') != 'trusted'

- name: "capn-identity | secret | fingerprint of the certificate"
  community.crypto.x509_certificate_info:
    path: "{{ _capn_identity_crt }}"
  register: _capn_identity_secret_current

- name: "capn-identity | secret | trust entries"
  ansible.builtin.uri:
    url: http://localhost/1.0/certificates?recursion=1
    unix_socket: "{{ _capn_identity_socket }}"
  register: _capn_identity_secret_entries

- name: "capn-identity | secret | remove earlier identities"
  ansible.builtin.uri:
    url: "http://localhost/1.0/certificates/{{ item.fingerprint }}"
    unix_socket: "{{ _capn_identity_socket }}"
    method: DELETE
  loop: "{{ _capn_identity_secret_entries.json.metadata | selectattr('name', 'match', '^' ~ _capn_identity_trust_name ~ '-[0-9a-f]{12}$')
            | selectattr('projects', 'equalto', [capn_identity_project])
            | rejectattr('fingerprint', 'eq', _capn_identity_secret_current.fingerprints.sha256 | replace(':', '') | lower) | list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
