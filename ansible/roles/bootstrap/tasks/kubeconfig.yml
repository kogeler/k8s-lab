---
- name: "bootstrap | kubeconfig | read k3s's admin kubeconfig"
  ansible.builtin.command:
    argv: "{{ _bootstrap_lxc + ['cat', '/etc/rancher/k3s/k3s.yaml'] }}"
  register: _bootstrap_kubeconfig_raw
  changed_when: false
  no_log: true

# One content on host and runner: the published endpoint.
- name: "bootstrap | kubeconfig | host and runner copies"
  vars:
    _raw: "{{ _bootstrap_kubeconfig_raw.stdout | from_yaml }}"
    _cluster: {cluster: {server: "https://{{ bootstrap_api_host }}:{{ bootstrap_api_port }}", tls-server-name: "{{ _bootstrap_tls_server_name }}"}}
    _content: "{{ _raw | combine({'clusters': _raw.clusters | map('combine', _cluster, recursive=True) | list}) | to_nice_yaml(indent=2) }}"
  block:
    - name: "bootstrap | kubeconfig | on the host"
      ansible.builtin.copy:
        content: "{{ _content }}"
        dest: "{{ _bootstrap_kubeconfig_host }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: "bootstrap | kubeconfig | runner directory"
      ansible.builtin.file:
        path: "{{ bootstrap_artifacts_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: "bootstrap | kubeconfig | on the runner"
      ansible.builtin.copy:
        content: "{{ _content }}"
        dest: "{{ _bootstrap_kubeconfig_runner }}"
        mode: "0600"
      no_log: true
      diff: false
      delegate_to: localhost
      become: false

- name: "bootstrap | kubeconfig | the published API answers"
  ansible.builtin.command:
    argv: ["{{ bootstrap_opt_root }}/bin/kubectl", --kubeconfig, "{{ _bootstrap_kubeconfig_host }}", get, --raw, /livez]
  register: _bootstrap_kubeconfig_livez
  until: _bootstrap_kubeconfig_livez.rc == 0
  retries: 12
  delay: 5
  changed_when: false
