---
# The harness host: how to reach it, and the harness-only facts about it. The
# values the roles consume are in tests/playbooks/group_vars/all.yml.
all:
  vars:
    # The repository: Molecule runs from tests/ (tests/molecule/Makefile), its
    # project directory.
    harness_repo_root: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') | dirname }}"
  children:
    k8slab_host:
      hosts:
        k8slab-host:
          # `make vm-up` writes this SSH config from `vagrant ssh-config`.
          ansible_host: host
          ansible_ssh_common_args: "-F {{ harness_repo_root }}/tests/vagrant/debian13/.vagrant/ssh-config"
          # An IPv6 client the in-VM router routes to, off the external link
          # (whose prefix is management_cluster_external_ipv6_prefix): its
          # prefix, the router at ::1, the client at ::2.
          harness_offlink_ipv6_prefix: "2001:db8:43:200::/64"
          harness_offlink_router: "{{ harness_offlink_ipv6_prefix | regex_replace('::/\\d+$', '::1') }}"
          harness_offlink_client: "{{ harness_offlink_ipv6_prefix | regex_replace('::/\\d+$', '::2') }}"
