---
# e2e-local: the management lifecycle through the reference playbook, then the
# workload cluster through the Terraform fixture roots (the cluster, then its
# add-ons) — the path a deployment uses for workload clusters. The idempotence
# step runs this file a second time; verify compares the result with the first
# run's record.
- name: "Converge | e2e-local | management lifecycle"
  ansible.builtin.import_playbook: ../../playbooks/management.yml

- name: "Converge | e2e-local | workload cluster through Terraform"
  hosts: localhost
  gather_facts: false
  vars:
    _fixture: "{{ harness_repo_root }}/tests/fixtures/terraform/workload-clusters/lab-default"
  # Two tasks, not a loop: a loop goes on with the add-on root after the cluster
  # root failed, and an add-on refresh while the cluster's API does not answer
  # drops the releases from the state (doc/troubleshooting.md).
  tasks:
    - name: "Converge | e2e-local | workload | terraform apply of the cluster root"
      community.general.terraform:
        project_path: "{{ _fixture }}/cluster"
        state: present
        force_init: true
        variables:
          handoff_path: "{{ k8s_lab_artifacts_dir }}/handoff.json"

    # Its result carries the root's outputs, the admin kubeconfig included,
    # printed from -v on (the CI log is public); a failure's message carries
    # none and stays visible at the default verbosity.
    - name: "Converge | e2e-local | workload | terraform apply of the add-on root"
      community.general.terraform:
        project_path: "{{ _fixture }}/addons"
        state: present
        force_init: true
        variables:
          handoff_path: "{{ k8s_lab_artifacts_dir }}/handoff.json"
      no_log: "{{ ansible_verbosity > 0 }}"

# What a re-run must not change: every node instance's creation time and every
# Machine's UID. Written once; later runs leave the file alone.
- name: "Converge | e2e-local | record the first run"
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: "Converge | e2e-local | record | instances in the LXD project"
      ansible.builtin.uri:
        url: "http://localhost/1.0/instances?project={{ k8s_lab_project_name }}&recursion=1"
        unix_socket: /var/snap/lxd/common/lxd/unix.socket
        return_content: true
      register: _converge_record_instances

    - name: "Converge | e2e-local | record | Machines on mgmt-1"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_lab_artifacts_dir }}/mgmt.kubeconfig"
        api_version: cluster.x-k8s.io/v1beta2
        kind: Machine
        namespace: "{{ k8s_lab_cluster_namespace }}"
      register: _converge_record_machines
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Converge | e2e-local | record | write once"
      ansible.builtin.copy:
        dest: "{{ k8s_lab_artifacts_dir }}/e2e-first-run.json"
        content: >-
          {{ {'instances': _converge_record_instances.json.metadata
                           | items2dict(key_name='name', value_name='created_at'),
              'machines': _converge_record_machines.resources | map(attribute='metadata')
                          | items2dict(key_name='name', value_name='uid')} | to_nice_json }}
        force: false
        mode: "0600"
      delegate_to: localhost
      become: false
