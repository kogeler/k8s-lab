---
# The external network's router, played inside the test host. A real uplink
# reaches a provider router that advertises the external IPv6 prefix; the
# harness has none, so a veth pair stands in: the end named by the playbook's
# uplink input is enslaved to the external bridge by the roles, and radvd on
# the peer end advertises the external prefix (`_ext6_prefix`) through it. The
# bridge itself stays address-free, as on a real host.
- name: "Prepare | ext6-ra | install radvd"
  # A fresh box has no package lists yet.
  ansible.builtin.apt:
    name: radvd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Prepare | ext6-ra | veth pair"
  ansible.builtin.copy:
    dest: /etc/systemd/network/45-k8slab-ext6-ra.netdev
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the k8s-lab test harness.
      [NetDev]
      Name={{ _ext6_ra_uplink }}
      Kind=veth

      [Peer]
      Name={{ _ext6_ra_peer }}
  register: _ext6_ra_netdev

- name: "Prepare | ext6-ra | router address on the peer end"
  ansible.builtin.copy:
    dest: /etc/systemd/network/45-k8slab-ext6-ra-peer.network
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the k8s-lab test harness.
      [Match]
      Name={{ _ext6_ra_peer }}

      [Network]
      LinkLocalAddressing=ipv6
      IPv6AcceptRA=no
      ConfigureWithoutCarrier=yes
      # The router is ::1 of the prefix.
      Address={{ _ext6_prefix | regex_replace('::/(\d+)$', '::1/\1') }}
  register: _ext6_ra_network

- name: "Prepare | ext6-ra | radvd configuration"
  # Short intervals so a new container gets an address quickly even if its
  # router solicitation is lost.
  ansible.builtin.copy:
    dest: /etc/radvd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the k8s-lab test harness.
      interface {{ _ext6_ra_peer }}
      {
        AdvSendAdvert on;
        MinRtrAdvInterval 3;
        MaxRtrAdvInterval 10;
        AdvDefaultLifetime 1800;
        prefix {{ _ext6_prefix }}
        {
          AdvOnLink on;
          AdvAutonomous on;
          AdvRouterAddr off;
        };
      };
  register: _ext6_ra_radvd

- name: "Prepare | ext6-ra | reload systemd-networkd"
  ansible.builtin.systemd:
    name: systemd-networkd.service
    state: reloaded
  when: _ext6_ra_netdev.changed or _ext6_ra_network.changed

- name: "Prepare | ext6-ra | wait for the peer end"
  ansible.builtin.wait_for:
    path: "/sys/class/net/{{ _ext6_ra_peer }}"
    timeout: 30

- name: "Prepare | ext6-ra | radvd running with the current configuration"
  ansible.builtin.systemd:
    name: radvd.service
    enabled: true
    state: "{{ 'restarted' if (_ext6_ra_radvd.changed or _ext6_ra_netdev.changed or _ext6_ra_network.changed) else 'started' }}"
