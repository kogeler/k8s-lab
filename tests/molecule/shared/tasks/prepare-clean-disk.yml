---
# Hand LXD a signature-free disk for its pool (`lxd_storage_source`): a disk an
# earlier pool left formatted makes LXD refuse it. Skipped when a pool already
# uses the disk (a scenario run on a host that already has the substrate).
- name: "Prepare | clean-disk | storage pools LXD already has"
  # failed_when: before the first run LXD is not installed, so there are none.
  ansible.builtin.command:
    argv: [/snap/bin/lxc, storage, list, --format, json]
  register: _prepare_clean_disk_pools
  changed_when: false
  failed_when: false

- name: "Prepare | clean-disk | wipe signatures"
  ansible.builtin.command:
    argv: [wipefs, -a, "{{ lxd_storage_source }}"]
  register: _prepare_clean_disk_wipefs
  changed_when: _prepare_clean_disk_wipefs.stdout | length > 0
  when: lxd_storage_source not in _sources
  vars:
    _pools: "{{ (_prepare_clean_disk_pools.stdout | from_json) if _prepare_clean_disk_pools.rc == 0 else [] }}"
    # After formatting, LXD keeps the device path only in `volatile.initial_source`
    # (`source` becomes the filesystem UUID); the key contains a dot, so match
    # keys rather than attribute paths.
    _sources: >-
      {{ _pools | map(attribute='config') | map('dict2items') | flatten
         | selectattr('key', 'in', ['source', 'volatile.initial_source'])
         | map(attribute='value') | list }}
