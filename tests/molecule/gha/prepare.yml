---
- name: "Prepare | gha | refuse outside GitHub Actions"
  ansible.builtin.import_playbook: ci-only.yml

# The runner first: Docker out of the way, no swap, disk space, a loop device
# for the pool. Then the same harness preparation as on the VM.
- name: "Prepare | gha | runner"
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: "Prepare | gha | runner cleanup"
      ansible.builtin.include_tasks: tasks/runner-cleanup.yml

    - name: "Prepare | gha | loop device for the pool"
      ansible.builtin.include_tasks: tasks/loopback-pool.yml
      vars:
        _gha_pool_gb: 40

- name: "Prepare | gha | harness"
  ansible.builtin.import_playbook: ../shared/prepare.yml
