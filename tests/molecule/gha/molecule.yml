---
# CI-only: the e2e-local scenario on a GitHub Actions runner, which is itself
# the test host (host_vars). Every playbook starts with ci-only.yml. No
# `diff: always`: the job log is public and a diff of a key or kubeconfig
# write would land in it.
ansible:
  playbooks:
    prepare: prepare.yml
provisioner:
  inventory:
    links:
      host_vars: host_vars
