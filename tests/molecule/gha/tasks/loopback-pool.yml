---
# The runner has no spare disk: a sparse file on /mnt (the large scratch
# volume) behind a loop device, published at lxd_storage_source so the path
# survives re-runs and loop renumbering. The size is the local VM's: mgmt-1
# and the 3+2 workload cluster fill about half of it, and a fuller pool makes
# the kubelets evict Pods (image and node file-system thresholds).
- name: "gha | loopback-pool | pool image"
  ansible.builtin.stat:
    path: /mnt/k8slab/lxd-pool.img
    get_checksum: false
  register: _gha_pool_image

- name: "gha | loopback-pool | room on /mnt"
  ansible.builtin.command:
    cmd: df --output=avail -BG /mnt
  register: _gha_mnt
  changed_when: false
  when: not _gha_pool_image.stat.exists

- name: "gha | loopback-pool | /mnt holds the pool"
  ansible.builtin.assert:
    that: (_gha_mnt.stdout_lines[-1] | trim | replace('G', '') | int) >= _gha_pool_gb
    fail_msg: >-
      /mnt has {{ _gha_mnt.stdout_lines[-1] | trim }} free; the pool needs
      {{ _gha_pool_gb }}G as it fills.
  when: not _gha_pool_image.stat.exists

- name: "gha | loopback-pool | scratch directory on /mnt"
  ansible.builtin.file:
    path: /mnt/k8slab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "gha | loopback-pool | sparse pool image"
  ansible.builtin.command:
    cmd: "truncate --size={{ _gha_pool_gb }}G /mnt/k8slab/lxd-pool.img"
    creates: /mnt/k8slab/lxd-pool.img

- name: "gha | loopback-pool | existing loop device"
  ansible.builtin.command:
    cmd: losetup -j /mnt/k8slab/lxd-pool.img
  register: _gha_loop_lookup
  changed_when: false

- name: "gha | loopback-pool | attach a loop device"
  ansible.builtin.command:
    cmd: losetup -f --show /mnt/k8slab/lxd-pool.img
  register: _gha_loop_attach
  when: _gha_loop_lookup.stdout | length == 0
  changed_when: true

- name: "gha | loopback-pool | directory of the stable path"
  ansible.builtin.file:
    path: "{{ lxd_storage_source | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "gha | loopback-pool | stable path for the loop device"
  ansible.builtin.file:
    src: "{{ _device }}"
    dest: "{{ lxd_storage_source }}"
    state: link
    force: true
    follow: false
  vars:
    _device: >-
      {{ (_gha_loop_lookup.stdout | regex_replace(':.*$', '') | trim)
         if _gha_loop_lookup.stdout | length > 0
         else (_gha_loop_attach.stdout | trim) }}
