---
# The runner image ships Docker, swap and several GiB of toolchains that either
# conflict with the LXD substrate or take the disk it needs.
- name: "gha | runner-cleanup | stop Docker"
  # Its NAT rules and bridge break Service routing inside the LXC nodes.
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - docker.socket
    - docker.service
    - containerd.service
  failed_when: false

- name: "gha | runner-cleanup | accept forwarded traffic"
  # Docker sets the iptables FORWARD policy to DROP and stopping it does not
  # restore it; bridged LXC egress is then dropped before LXD's own nftables
  # rules see it. One ACCEPT rule on top, policy untouched (runner only).
  ansible.builtin.iptables:
    chain: FORWARD
    jump: ACCEPT
    action: insert

- name: "gha | runner-cleanup | active swap"
  ansible.builtin.command:
    cmd: swapon --show --noheadings
  register: _gha_swap
  changed_when: false

- name: "gha | runner-cleanup | swap off"
  # kubeadm refuses to start a kubelet with swap on.
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: true
  when: _gha_swap.stdout | length > 0

- name: "gha | runner-cleanup | no swap entries in fstab"
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'

- name: "gha | runner-cleanup | purge preinstalled packages"
  # Space on / for the snap and image caches.
  ansible.builtin.apt:
    name:
      - "google-chrome-stable"
      - "firefox"
      - "powershell"
      - "azure-cli"
      - "google-cloud-cli"
      - "mysql-server"
      - "mysql-client"
      - "postgresql-*"
      - "ruby"
      - "php*"
    state: absent
    purge: true
  failed_when: false

- name: "gha | runner-cleanup | remove preinstalled toolchains"
  # No per-file diff: the Android SDK alone is tens of thousands of files.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  diff: false
  loop:
    - /usr/share/dotnet
    - /usr/share/swift
    - /opt/hostedtoolcache/CodeQL
    - /opt/microsoft
    - /usr/local/lib/android
    - /usr/local/share/boost
    - /imagegeneration
