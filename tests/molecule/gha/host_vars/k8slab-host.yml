---
# What differs on a GitHub Actions runner: the runner is the test host, has no
# spare disk and pulls every image cold. The roles reach Kubernetes through the
# runner-side kubeconfigs and read the root-only host copies with kubectl on
# the host, so a local connection needs no relaxed file modes.

# The runner itself, not the Vagrant VM.
ansible_connection: local
ansible_host: localhost
ansible_python_interpreter: "{{ ansible_playbook_python }}"
ansible_ssh_common_args: ""

# A loop device over a sparse file on /mnt (tasks/loopback-pool.yml), behind a
# stable path.
lxd_storage_source: "/dev/disk/by-id/k8slab-lxdpool-loop"

# Cold image pulls on the runner take about twice as long as on the VM. The
# clusterctl timeout must stay above its cert-manager wait.
bootstrap_wait_timeout: 900
clusterctl_timeout: 1800
clusterctl_cert_manager_timeout: "25m"
